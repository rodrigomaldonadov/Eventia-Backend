server:
  port: 8080

spring:
  application:
    name: Eventia

  profiles:
    default: dev

  datasource:
    # Base de datos H2 en archivo.
    url: jdbc:h2:file:./data/eventia
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console


security:
  jwt:
    key-private: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%thread] %logger{36} - %msg%n"
  level:
    com:
      backend:
        eventia: DEBUG
    # Para la demostración, subir temporalmente a DEBUG:
    # logging.level.org.springframework.security: DEBUG
    org:
      springframework:
        security: INFO